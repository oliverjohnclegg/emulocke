name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
          - os: windows-latest
            label: win-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            libcurl4-openssl-dev liblzma-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxfixes-dev libxrender-dev libxkbcommon-dev

      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-xz
            git

      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Linux
        if: runner.os == 'Linux'
        run: cmake --build build --config Release --parallel

      - name: Sprite check
        if: runner.os == 'Linux'
        run: ./build/emulocke-sprite-check

      - name: Game art check
        if: runner.os == 'Linux'
        run: ./build/emulocke-game-art-check

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake --build build --config Release --parallel

      - name: Test Linux
        if: runner.os == 'Linux'
        run: ctest --test-dir build --output-on-failure

      - name: Test Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure

      - name: Stage
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/roms
          if [ -f build/Release/emulocke.exe ]; then
            bin=build/Release/emulocke.exe
          elif [ -f build/emulocke.exe ]; then
            bin=build/emulocke.exe
          else
            bin=build/emulocke
          fi
          dist_name=$(tr -d '\r\n' < build/dist-name.txt)
          if [ -z "$dist_name" ]; then
            echo "build/dist-name.txt is empty" >&2
            exit 1
          fi
          cp "$bin" "dist/$dist_name"
          cp -a "$(dirname "$bin")/assets" dist/
          if [ -d "$(dirname "$bin")/roms" ]; then
            cp -a "$(dirname "$bin")/roms/." dist/roms/
          fi
          artifact="${dist_name%.exe}"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.artifact }}
          path: dist/
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: VERSION
          sparse-checkout-cone-mode: false

      - name: Download build zips
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p dist
          for dir in artifacts/*; do
            name=$(basename "$dir")
            (cd "$dir" && zip -r "$GITHUB_WORKSPACE/dist/${name}.zip" .)
          done
          echo "VERSION=$(tr -d ' \r\n' < VERSION)" >> "$GITHUB_ENV"

      - name: Publish Vanguard
        if: github.ref == 'refs/heads/dev'
        uses: ncipollo/release-action@v1
        with:
          tag: vanguard
          name: Vanguard
          commit: ${{ github.sha }}
          prerelease: true
          makeLatest: false
          allowUpdates: true
          replacesArtifacts: true
          artifacts: dist/*.zip
          body: Rolling tryout from `dev`. This release is replaced on every push to `dev`.

      - name: Publish Stable
        if: github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ env.VERSION }}
          name: Stable v${{ env.VERSION }}
          commit: ${{ github.sha }}
          prerelease: false
          makeLatest: true
          allowUpdates: true
          replacesArtifacts: true
          artifacts: dist/*.zip
          body: Versioned cut from `main`.
