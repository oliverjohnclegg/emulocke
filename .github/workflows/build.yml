name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  LINUX_PACKAGES: >-
    ninja-build pkg-config libcurl4-openssl-dev liblzma-dev
    libx11-dev libxext-dev libxrandr-dev libxcursor-dev
    libxi-dev libxfixes-dev libxrender-dev libxkbcommon-dev

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
          - os: windows-latest
            label: win-x64
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_PACKAGES

      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          update: false
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-xz
            git

      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Linux
        if: runner.os == 'Linux'
        run: cmake --build build --config Release --parallel

      - name: Sprite check
        if: runner.os == 'Linux'
        run: ./build/emulocke-sprite-check

      - name: Game art check
        if: runner.os == 'Linux'
        run: ./build/emulocke-game-art-check

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake --build build --config Release --parallel

      - name: Sprite check Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ./build/emulocke-sprite-check.exe

      - name: Test Linux
        if: runner.os == 'Linux'
        run: ctest --test-dir build --output-on-failure

      - name: Test Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure

      - name: Windows PE must be static
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          bin=build/emulocke.exe
          if [ ! -f "$bin" ]; then
            echo "missing $bin" >&2
            exit 1
          fi
          objdump -p "$bin" | grep -E 'DLL Name:' | tee /tmp/pe-dlls.txt
          if grep -Ei 'libcurl|liblzma|libssl|libcrypto|zlib|libzstd|libbrotli|libnghttp|libidn|libpsl|libssh|libiconv|libintl|libunistring|libwinpthread|libgcc|libstdc\+\+' /tmp/pe-dlls.txt; then
            echo "emulocke.exe still depends on MSYS2 DLLs" >&2
            exit 1
          fi

      - name: Stage
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/roms
          if [ -f build/Release/emulocke.exe ]; then
            bin=build/Release/emulocke.exe
          elif [ -f build/emulocke.exe ]; then
            bin=build/emulocke.exe
          else
            bin=build/emulocke
          fi
          dist_name=$(tr -d '\r\n' < build/dist-name.txt)
          if [ -z "$dist_name" ]; then
            echo "build/dist-name.txt is empty" >&2
            exit 1
          fi
          cp "$bin" "dist/$dist_name"
          cp -a "$(dirname "$bin")/assets" dist/
          if [ -d "$(dirname "$bin")/roms" ]; then
            cp -a "$(dirname "$bin")/roms/." dist/roms/
          fi
          artifact="${dist_name%.exe}"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.stage.outputs.artifact }}
          path: dist/
          if-no-files-found: error

  sanitize:
    name: linux-asan-ubsan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_PACKAGES clang libclang-rt-dev

      - name: Configure
        run: >-
          cmake -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DEMULOCKE_SANITIZE=address

      - name: Build
        run: cmake --build build-asan --parallel

      - name: Test under ASan and UBSan
        run: ctest --test-dir build-asan --output-on-failure

  tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_PACKAGES clang clang-tidy

      - name: Configure
        run: >-
          cmake -B build-tidy -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++

      - name: Run clang-tidy over src
        run: run-clang-tidy -p build-tidy -quiet "^$GITHUB_WORKSPACE/src/"

  fuzz-smoke:
    name: libfuzzer-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_PACKAGES clang libclang-rt-dev

      - name: Configure
        run: >-
          cmake -B build-fuzz -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DEMULOCKE_SANITIZE=address -DEMULOCKE_FUZZ=ON

      - name: Build harnesses
        run: cmake --build build-fuzz --parallel --target fuzzers

      - name: Fuzz each harness for 60s
        run: ./tools/fuzz/smoke.sh build-fuzz 60

      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-reproducers
          path: /tmp/emulocke-fuzz/artifacts/
          if-no-files-found: ignore

  release:
    name: GitHub Release
    needs: [build, sanitize, tidy, fuzz-smoke]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: VERSION
          sparse-checkout-cone-mode: false

      - name: Download build zips
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p dist
          for dir in artifacts/*; do
            name=$(basename "$dir")
            (cd "$dir" && zip -r "$GITHUB_WORKSPACE/dist/${name}.zip" .)
          done
          echo "VERSION=$(tr -d ' \r\n' < VERSION)" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Drop stale vanguard tag
        if: github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete vanguard --yes || true

      - name: Publish Vanguard
        if: github.ref == 'refs/heads/dev'
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: vanguard-${{ env.SHORT_SHA }}
          name: Vanguard ${{ env.SHORT_SHA }}
          commit: ${{ github.sha }}
          prerelease: true
          makeLatest: false
          allowUpdates: false
          skipIfReleaseExists: true
          immutableCreate: true
          artifacts: dist/*.zip
          body: Snapshot of `dev` at `${{ github.sha }}`.

      - name: Publish Stable
        if: github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: v${{ env.VERSION }}
          name: Stable v${{ env.VERSION }}
          commit: ${{ github.sha }}
          prerelease: false
          makeLatest: true
          allowUpdates: false
          skipIfReleaseExists: true
          immutableCreate: true
          artifacts: dist/*.zip
          body: Versioned cut from `main`.
